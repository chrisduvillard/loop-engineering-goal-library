name: Apply adaptive question clarity

on:
  push:
    branches: [codex/adaptive-question-clarity]

concurrency:
  group: adaptive-question-clarity
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/adaptive-question-clarity
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply and verify
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_adaptive_question_clarity.py
          python - <<'PY'
          from pathlib import Path

          for path in Path("docs/goals/2026-08-26-adaptive-question-clarity").glob("*.md"):
              lines = path.read_text(encoding="utf-8").splitlines()
              path.write_text("\n".join(line.rstrip() for line in lines) + "\n", encoding="utf-8")

          replacements = {
              Path("skills/shape-goal/goal-contract-template.md"): (
                  ("**Shaping depth:** Adaptive / Thorough / Exhaustive  \n", "**Shaping depth:** Adaptive / Thorough / Exhaustive\n"),
                  ("**Clarity gate:** Not run / Needs clarification / Pass  \n", "**Clarity gate:** Not run / Needs clarification / Pass\n"),
              ),
              Path("skills/shape-goal/templates/shaping-history-template.md"): (
                  ("**Shaping depth:** Adaptive / Thorough / Exhaustive  \n", "**Shaping depth:** Adaptive / Thorough / Exhaustive\n"),
                  ("**Clarity gate:** Not run / Needs clarification / Pass  \n", "**Clarity gate:** Not run / Needs clarification / Pass\n"),
              ),
          }
          for path, pairs in replacements.items():
              source = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  source = source.replace(old, new)
              path.write_text(source, encoding="utf-8")
          PY
          rm -f scripts/apply_adaptive_question_clarity.py
          rm -f .github/workflows/apply-adaptive-question-clarity.yml
          python scripts/sync_goal_launchers.py --check
          python scripts/sync_goal_docs.py --check
          python scripts/validate_shaping_history_diff.py --self-test --base-ref origin/main
          python scripts/validate_repository.py
          python scripts/package_skills.py
          output="$(npx -y skills@1.5.23 add . --list)"
          printf '%s\n' "$output"
          grep -q "shape-goal" <<<"$output"
          grep -q "goal-engine" <<<"$output"

      - name: Commit reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Make goal shaping adaptively exhaustive"
          git push origin HEAD:codex/adaptive-question-clarity
