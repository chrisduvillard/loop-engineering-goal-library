name: Apply delegated judgment refinement

on:
  push:
    branches: [codex/adaptive-question-clarity]

concurrency:
  group: delegated-judgment-refinement
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/adaptive-question-clarity
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply and verify
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_delegation_requirement_strength.py
          rm -f scripts/apply_delegation_requirement_strength.py
          rm -f .github/workflows/apply-delegation-requirement-strength.yml
          python scripts/sync_goal_launchers.py --check
          python scripts/sync_goal_docs.py --check
          python scripts/validate_shaping_history_diff.py --self-test --base-ref origin/main
          python scripts/validate_repository.py
          python scripts/package_skills.py
          output="$(npx -y skills@1.5.23 add . --list)"
          printf '%s\n' "$output"
          grep -q "shape-goal" <<<"$output"
          grep -q "goal-engine" <<<"$output"

      - name: Commit reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Preserve requirement strength and bounded delegation"
          git push origin HEAD:codex/adaptive-question-clarity
