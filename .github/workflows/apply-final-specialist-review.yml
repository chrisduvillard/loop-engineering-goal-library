name: Apply final specialist review

on:
  push:
    branches: [codex/final-specialist-review]

concurrency:
  group: final-specialist-review
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/final-specialist-review
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply reviewed changes and regenerate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fix_apply_final_specialist_review.py
          python scripts/apply_final_specialist_review.py
          python scripts/sync_goal_launchers.py --write
          python scripts/sync_goal_docs.py --write
          rm -f scripts/fix_apply_final_specialist_review.py
          rm -f .github/workflows/apply-final-specialist-review.yml
          python scripts/sync_goal_launchers.py --check
          python scripts/sync_goal_docs.py --check
          python scripts/validate_repository.py
          python scripts/package_skills.py

      - name: Commit generated review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply final independent specialist review"
          git push origin HEAD:codex/final-specialist-review
