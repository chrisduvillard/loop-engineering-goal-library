name: Apply overlay validation fix

on:
  push:
    branches: [codex/final-specialist-review]

concurrency:
  group: overlay-validation-fix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/final-specialist-review
          fetch-depth: 0

      - name: Apply and verify
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_overlay_validation_fix.py
          python scripts/sync_goal_launchers.py --check
          python scripts/sync_goal_docs.py --check
          python scripts/validate_shaping_history_diff.py --self-test --base-ref origin/main
          python scripts/validate_repository.py

      - name: Commit non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows/apply-overlay-validation-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Validate assurance overlay names"
          git push origin HEAD:codex/final-specialist-review
