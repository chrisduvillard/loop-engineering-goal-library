name: Apply specialist audit

on:
  push:
    branches: [codex/specialist-audit]

concurrency:
  group: specialist-audit-application
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/specialist-audit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22.20.0"
          cache: npm

      - name: Apply and verify specialist improvements
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_specialist_audit.py
          rm -f scripts/apply_specialist_audit.py
          rm -f .github/workflows/apply-specialist-audit.yml
          rm -f .github/workflows/export-specialist-audit-snapshot.yml
          python scripts/sync_goal_docs.py --write
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          python scripts/sync_goal_launchers.py --check
          python scripts/sync_goal_docs.py --check
          python scripts/validate_shaping_history_diff.py --self-test --base-ref origin/main
          npm ci --ignore-scripts
          python scripts/validate_repository.py
          output="$(npx --no-install skills add . --list)"
          printf '%s\n' "$output"
          grep -q "shape-goal" <<<"$output"
          grep -q "goal-engine" <<<"$output"
          python scripts/package_skills.py

      - name: Commit verified audit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply specialist audit improvements"
          git push origin HEAD:codex/specialist-audit
