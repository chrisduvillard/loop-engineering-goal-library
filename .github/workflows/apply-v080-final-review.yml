name: Apply v0.8.0 final review

on:
  push:
    branches: [codex/v080-final-review]

concurrency:
  group: v080-final-review
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/v080-final-review
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply, generate, and verify
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_v080_final_review.py
          rm -f scripts/apply_v080_final_review.py
          rm -f .github/workflows/apply-v080-final-review.yml
          python scripts/sync_goal_launchers.py --write
          python scripts/sync_goal_docs.py --write
          python scripts/sync_goal_launchers.py --check
          python scripts/sync_goal_docs.py --check
          python scripts/validate_shaping_history_diff.py --self-test --base-ref origin/main
          python scripts/validate_repository.py
          python scripts/package_skills.py
          output="$(npx -y skills@1.5.23 add . --list)"
          printf '%s\n' "$output"
          grep -q "shape-goal" <<<"$output"
          grep -q "goal-engine" <<<"$output"
          test "$(find goals -maxdepth 1 -name '[0-9][0-9]-*.md' | wc -l | tr -d ' ')" = "31"
          test "$(wc -l < README.md | tr -d ' ')" -le 235

      - name: Commit synchronized result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for relative in (
              "docs/goals/2026-08-26-final-review-readme-onboarding/CONTRACT.md",
              "docs/goals/2026-08-26-final-review-readme-onboarding/PROGRESS.md",
          ):
              path = Path(relative)
              path.write_text(
                  "\n".join(line.rstrip() for line in path.read_text(encoding="utf-8").splitlines()) + "\n",
                  encoding="utf-8",
              )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Complete v0.8.0 final review"
          git push origin HEAD:codex/v080-final-review
