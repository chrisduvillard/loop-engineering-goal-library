name: Apply zero-friction update

on:
  push:
    branches: [codex/final-zero-friction-review]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/final-zero-friction-review
          fetch-depth: 0

      - name: Verify and apply reviewed archive
        shell: bash
        run: |
          cat .github/zero-friction-update.part* | base64 --decode > /tmp/update.tar.xz
          echo "c4849a7dd575ee44807c9a8daffe5e9658125930785f6e497e362f202a0f88ca  /tmp/update.tar.xz" | sha256sum --check -
          tar -xJf /tmp/update.tar.xz
          rm -f .github/zero-friction-update.part*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply final zero-friction deep review"
          git push origin HEAD:codex/final-zero-friction-review
