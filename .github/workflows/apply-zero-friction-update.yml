name: Apply zero-friction update

on:
  push:
    branches: [codex/final-zero-friction-review]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/final-zero-friction-review
          fetch-depth: 0

      - name: Verify and apply reviewed archive
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          part01a = bytearray(Path('.github/zf-fix-01a').read_bytes())
          if len(part01a) != 4000:
              raise SystemExit(f'Unexpected 01a length: {len(part01a)}')
          part01a[2709] = ord('C')
          if sha256(part01a).hexdigest() != '2b41f740dea6d805fff554a9383df66edcfa987b3c01e09cac9136199d520c09':
              raise SystemExit('Patched 01a checksum mismatch')

          part01 = bytes(part01a) + Path('.github/zf-fix-01b').read_bytes() + Path('.github/zf-fix-01c').read_bytes()
          if len(part01) != 12000 or sha256(part01).hexdigest() != '9f649a4639fc3c597f505445a1f64d84f1062994cc325e05978d75c58e36b969':
              raise SystemExit('Part 01 checksum mismatch')

          part04 = Path('.github/zf-fix-04a').read_bytes() + Path('.github/zf-fix-04b').read_bytes() + Path('.github/zf-fix-04c').read_bytes()
          if len(part04) != 11400 or sha256(part04).hexdigest() != '19be74035fe1a7631ec190a92cadc306c7dae310101f58c15f8b7c8c9965463d':
              raise SystemExit('Part 04 checksum mismatch')

          combined = b''.join([
              Path('.github/zero-friction-update.part00').read_bytes(),
              part01,
              Path('.github/zero-friction-update.part02').read_bytes(),
              Path('.github/zero-friction-update.part03').read_bytes(),
              part04,
          ])
          if len(combined) != 59400:
              raise SystemExit(f'Unexpected encoded payload length: {len(combined)}')
          Path('/tmp/update.b64').write_bytes(combined)
          PY
          base64 --decode /tmp/update.b64 > /tmp/update.tar.xz
          echo "c4849a7dd575ee44807c9a8daffe5e9658125930785f6e497e362f202a0f88ca  /tmp/update.tar.xz" | sha256sum --check -
          tar -xJf /tmp/update.tar.xz
          cp .github/workflows/validate.yml /tmp/reviewed-validate.yml
          git checkout HEAD -- .github/workflows/validate.yml
          rm -f .github/zero-friction-update.part* .github/zf-fix-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply final zero-friction deep review"
          git push origin HEAD:codex/final-zero-friction-review
