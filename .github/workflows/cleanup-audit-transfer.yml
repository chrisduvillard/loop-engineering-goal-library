name: Verify and clean audit transfer

on:
  push:
    branches: [audit-remediation-runtime-hardening]
    paths:
      - .github/workflows/cleanup-audit-transfer.yml

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.20.0"
          cache: npm
      - name: Remove temporary transfer artifacts
        shell: bash
        run: |
          rm -f __probe_should_not_create__
          rm -f .github/workflows/export-audit-branch.yml
          rm -f .github/workflows/apply-audit-hardening.yml
          rm -f .github/workflows/cleanup-audit-transfer.yml
      - name: Verify final branch source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          python -m compileall -q scripts tests skills/goal-engine/scripts
          python -m unittest discover -s tests -v
          python scripts/sync_goal_launchers.py --check
          python scripts/sync_goal_docs.py --check
          python scripts/sync_skill_references.py --check
          python scripts/goalctl.py self-test
          python scripts/run_behavioral_evals.py --self-test
          python scripts/validate_goal_archives.py --self-test
          python scripts/validate_tooling_contract.py --self-test
          python scripts/validate_repository.py
          output="$(npx --no-install skills add . --list)"
          grep -q "shape-goal" <<<"$output"
          grep -q "goal-engine" <<<"$output"
      - name: Commit cleaned verified branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to clean"
          else
            git commit -m "Verify and clean runtime hardening branch"
            git push origin HEAD:audit-remediation-runtime-hardening
          fi
