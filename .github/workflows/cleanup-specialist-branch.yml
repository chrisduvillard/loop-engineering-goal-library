name: Cleanup merged and superseded branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Delete merged or superseded branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            codex/specialist-audit \
            dependabot/github_actions/actions/setup-node-7.0.0
          do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "$branch is already absent."
            fi
          done
