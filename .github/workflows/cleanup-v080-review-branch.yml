name: Cleanup v0.8 review branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Delete merged branch and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/v080-final-review
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            git push origin --delete "${branch}"
          else
            printf 'Already absent: %s\n' "${branch}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-v080-review-branch.yml
          git commit -m "Remove temporary v0.8 branch cleanup workflow"
          git push origin HEAD:main
