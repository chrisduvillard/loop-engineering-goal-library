name: Export specialist audit snapshot

on:
  push:
    branches: [codex/specialist-audit]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create source snapshot
        run: git archive --format=zip --output=repository.zip HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: specialist-audit-source
          path: repository.zip
          if-no-files-found: error
          retention-days: 1
