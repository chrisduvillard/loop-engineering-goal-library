name: Publish 0.11.1 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-0.11.1-once.yml

concurrency:
  group: publish-0.11.1-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-publish-clean:
    if: github.actor == 'chrisduvillard'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out merged main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20.0'
          cache: npm

      - name: Install locked tooling
        run: npm ci --ignore-scripts

      - name: Remove this one-time workflow from the release candidate tree
        run: rm -f .github/workflows/publish-0.11.1-once.yml

      - name: Confirm release identity
        shell: bash
        run: |
          test "$(tr -d '\r\n' < VERSION)" = '0.11.1'
          test -f LICENSE
          test -f SECURITY.md
          test -f skills/goal-engine/scripts/goalctl.py

      - name: Run the complete merged-tree verification gate
        shell: bash
        run: |
          python -m compileall -q scripts tests skills/goal-engine/scripts
          python -m unittest discover -s tests -v
          python scripts/validate_repository.py
          python scripts/sync_goal_launchers.py --check
          python scripts/sync_goal_docs.py --check
          python scripts/validate_shaping_history_diff.py --self-test
          python scripts/validate_question_state.py --self-test
          python scripts/validate_goal_archives.py --self-test
          python scripts/validate_tooling_contract.py --self-test
          python skills/goal-engine/scripts/goalctl.py self-test
          python scripts/evaluate_behavior.py --self-test
          output="$(npx --no-install skills add . --list)"
          printf '%s\n' "$output"
          grep -q "shape-goal" <<<"$output"
          grep -q "goal-engine" <<<"$output"
          python scripts/package_skills.py
          git diff --check

      - name: Record merged-tree release evidence
        shell: bash
        run: |
          cat > docs/audits/2026-08-30-runtime-hardening/FINAL_VERIFICATION.md <<EOF
          # Final verification record

          - Release gate workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Merged tree tested: ${GITHUB_SHA}
          - Version: 0.11.1
          - Complete unit and repository validation suite: passed before publication
          - Goal runtime self-test: passed
          - Behavioral invariant self-test: passed
          - Standalone and combined archive closure: passed
          - Skills CLI discovery: passed
          - Live host matrix: pending authenticated repeated Codex and Claude Code trials
          EOF

      - name: Commit permanent clean main tree
        shell: bash
        run: |
          git config user.name "Chris Duvillard"
          git config user.email "duvillard.c@gmail.com"
          git add -A
          git commit -m "Record 0.11.1 release verification"
          git push origin HEAD:main

      - name: Rebuild packages from the permanent commit
        run: |
          rm -rf dist
          python scripts/package_skills.py

      - name: Publish immutable GitHub release
        shell: bash
        run: |
          tag='v0.11.1'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" dist/* \
            --target "$(git rev-parse HEAD)" \
            --title "$tag" \
            --generate-notes
