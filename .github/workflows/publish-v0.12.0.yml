name: Publish verified v0.12.0 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.12.0.yml

permissions:
  contents: write

concurrency:
  group: publish-v0.12.0
  cancel-in-progress: false

jobs:
  verify-clean-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.20.0"
          cache: npm

      - name: Remove temporary release files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-v0.12.0.yml
          rm -f docs/RELEASE_PROCESS_NOTE.md
          rm -f docs/audits/2026-08-30-runtime-hardening/RELEASE_PROCESS.md
          rm -f docs/audits/2026-08-30-runtime-hardening/RELEASE_TARGET.md
          rm -f docs/audits/2026-08-30-runtime-hardening/RELEASE_VERIFICATION.md
          rm -f docs/audits/2026-08-30-runtime-hardening/RELEASE_AUTHORITY.md
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "validate.yml"

      - name: Install locked Skills CLI
        run: npm ci --ignore-scripts

      - name: Verify clean release tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.12.0"
          python -m compileall -q scripts tests skills/goal-engine/scripts
          python -m unittest discover -s tests -v
          python scripts/sync_goal_launchers.py --check
          python scripts/sync_goal_docs.py --check
          python scripts/sync_skill_references.py --check
          python scripts/goalctl.py self-test
          python scripts/run_behavioral_evals.py --self-test
          python scripts/validate_goal_archives.py --self-test
          python scripts/validate_tooling_contract.py --self-test
          python scripts/validate_repository.py
          output="$(npx --no-install skills add . --list)"
          printf '%s\n' "$output"
          grep -q "shape-goal" <<<"$output"
          grep -q "goal-engine" <<<"$output"

      - name: Commit the clean verified release tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize clean v0.12.0 release tree"
          git push origin HEAD:main

      - name: Build deterministic release assets twice
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist /tmp/loop-release-second
          python scripts/package_skills.py
          python scripts/package_skills.py --output-dir /tmp/loop-release-second
          cmp dist/SHA256SUMS /tmp/loop-release-second/SHA256SUMS
          cmp dist/RELEASE_MANIFEST.json /tmp/loop-release-second/RELEASE_MANIFEST.json
          sha256sum --check dist/SHA256SUMS

      - name: Publish immutable GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.12.0 >/dev/null 2>&1; then
            echo "v0.12.0 already exists; refusing to overwrite it" >&2
            exit 1
          fi
          target="$(git rev-parse HEAD)"
          cat > /tmp/release-notes.md <<'EOF'
          Version 0.12.0 is the runtime-hardening beta release.

          Highlights:
          - explicit-only shaping and execution
          - read-only, proposal-only, and applied-fix mutation modes
          - deterministic canonical state, approval fingerprints, atomic leases, mutation checks, sanitization, diagnostics, and false-achievement rejection
          - separate goal status, run termination, and goal outcome
          - Goal Kernel and GOAL_EVIDENCE v1
          - assurance levels and held-out verification guidance
          - compact generated profile and overlay references
          - behavioral evaluation scenarios
          - one deterministic, reference-closed combined bundle with checksums and a release manifest
          - MIT licensing, security policy, plugin metadata, CODEOWNERS, and governance guidance

          Repeated native Codex and Claude Code host trials remain pending in docs/HOST_UAT.md and are required before production-proven or 1.0 status.
          EOF
          gh release create v0.12.0 \
            --target "$target" \
            --title "Loop Engineering 0.12.0" \
            --notes-file /tmp/release-notes.md \
            dist/loop-engineering-skills-0.12.0.zip \
            dist/RELEASE_MANIFEST.json \
            dist/SHA256SUMS
