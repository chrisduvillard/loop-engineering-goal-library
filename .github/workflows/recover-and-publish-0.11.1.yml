name: Recover and publish 0.11.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-and-publish-0.11.1.yml

concurrency:
  group: recover-and-publish-0.11.1
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  recover:
    if: github.actor == 'chrisduvillard'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20.0'
          cache: npm

      - name: Install locked tooling
        run: npm ci --ignore-scripts

      - name: Apply the approved remediation idempotently
        shell: bash
        run: |
          if [[ -f scripts/apply_audit_remediation.py ]]; then
            python scripts/apply_audit_remediation.py
          fi

      - name: Correct package-local reference resolution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import shutil

          root = Path.cwd()
          packager = root / 'scripts/package_skills.py'
          text = packager.read_text(encoding='utf-8')
          text = text.replace(
              r'r"`((?:\./|\.\./|references/|templates/|agents/|scripts/|schemas/|profiles/)[^`\s]+\.md(?:#[^`\s]+)?)`"',
              r'r"`((?:\./|\.\./)[^`\s]+\.md(?:#[^`\s]+)?)`"',
          )
          if 'REQUIRED_STANDALONE_ASSETS' not in text:
              marker = 'LOCAL_PREFIXES = ("./", "../", "references/", "templates/", "agents/", "scripts/", "schemas/", "profiles/")\n'
              addition = '''LOCAL_PREFIXES = ("./", "../", "references/", "templates/", "agents/", "scripts/", "schemas/", "profiles/")
REQUIRED_STANDALONE_ASSETS = {
    "shape-goal": {
        "references/loop-profiles.md",
        "references/assurance-overlays.md",
        "templates/project-harness-template.md",
    },
    "goal-engine": {
        "templates/shaping-history-template.md",
        "templates/goal-portfolio-template.md",
    },
}
'''
              if marker not in text:
                  raise SystemExit('Could not locate package manifest insertion point')
              text = text.replace(marker, addition)
              target = '''        if individual and "SKILL.md" not in names:
            raise ValueError(f"{path.name}: SKILL.md is not at the archive root")
'''
              replacement = '''        if individual and "SKILL.md" not in names:
            raise ValueError(f"{path.name}: SKILL.md is not at the archive root")
        if individual:
            package_kind = "shape-goal" if "profiles/index.json" in names else "goal-engine"
            missing_assets = sorted(REQUIRED_STANDALONE_ASSETS[package_kind] - set(names))
            if missing_assets:
                raise ValueError(
                    f"{path.name}: standalone package is missing required transitive assets: "
                    + ", ".join(missing_assets)
                )
'''
              if target not in text:
                  raise SystemExit('Could not locate package validation insertion point')
              text = text.replace(target, replacement)
          packager.write_text(text, encoding='utf-8', newline='\n')

          profile_readme = root / 'skills/shape-goal/profiles/README.md'
          if profile_readme.exists():
              profile_text = profile_readme.read_text(encoding='utf-8')
              profile_text = profile_text.replace('`references/profile-inputs.md`', '`../references/profile-inputs.md`')
              profile_text = profile_text.replace('`references/loop-profiles.md`', '`../references/loop-profiles.md`')
              profile_readme.write_text(profile_text, encoding='utf-8', newline='\n')

          skills = root / 'skills'
          for skill_name in ('shape-goal', 'goal-engine'):
              skill_root = skills / skill_name
              for document in sorted(skill_root.rglob('*.md')):
                  original = document.read_text(encoding='utf-8')
                  changed = original
                  patterns = (
                      (re.compile(r'\.\./goal-engine/(references|templates)/([A-Za-z0-9_.-]+\.md)'), 'goal-engine'),
                      (re.compile(r'\.\./\.\./shape-goal/(references|templates)/([A-Za-z0-9_.-]+\.md)'), 'shape-goal'),
                  )
                  for pattern, other_skill in patterns:
                      while True:
                          match = pattern.search(changed)
                          if not match:
                              break
                          source = skills / other_skill / match.group(1) / match.group(2)
                          if not source.is_file():
                              raise SystemExit(f'Missing cross-skill source: {source}')
                          destination = skill_root / match.group(1) / match.group(2)
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copyfile(source, destination)
                          relative = os.path.relpath(destination, document.parent).replace(os.sep, '/')
                          changed = changed[:match.start()] + relative + changed[match.end():]
                  if changed != original:
                      document.write_text(changed, encoding='utf-8', newline='\n')
          PY

      - name: Remove every temporary control before validation
        shell: bash
        run: |
          rm -f .github/workflows/export-audit-branch.yml
          rm -f .github/workflows/apply-audit-remediation.yml
          rm -f .github/workflows/finalize-audit-remediation.yml
          rm -f .github/workflows/repair-and-stage-audit-remediation.yml
          rm -f .github/workflows/clean-stage-audit-remediation.yml
          rm -f .github/workflows/stage-status.yml
          rm -f .github/workflows/publish-0.11.1-once.yml
          rm -f .github/workflows/recover-and-publish-0.11.1.yml
          rm -f scripts/apply_audit_remediation.py

      - name: Refresh generated files
        run: |
          python scripts/sync_goal_launchers.py
          python scripts/sync_goal_docs.py

      - name: Run complete repository and package verification
        shell: bash
        run: |
          python -m compileall -q scripts tests skills/goal-engine/scripts
          python -m unittest discover -s tests -v
          python scripts/validate_repository.py
          python scripts/sync_goal_launchers.py --check
          python scripts/sync_goal_docs.py --check
          python scripts/validate_shaping_history_diff.py --self-test
          python scripts/validate_question_state.py --self-test
          python scripts/validate_goal_archives.py --self-test
          python scripts/validate_tooling_contract.py --self-test
          python skills/goal-engine/scripts/goalctl.py self-test
          python scripts/evaluate_behavior.py --self-test
          output="$(npx --no-install skills add . --list)"
          printf '%s\n' "$output"
          grep -q "shape-goal" <<<"$output"
          grep -q "goal-engine" <<<"$output"
          python scripts/package_skills.py
          git diff --check

      - name: Record successful recovery evidence
        shell: bash
        run: |
          mkdir -p docs/audits/2026-08-30-runtime-hardening
          cat > docs/audits/2026-08-30-runtime-hardening/FINAL_VERIFICATION.md <<EOF
          # Final verification record

          - Recovery gate: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Source tree tested: ${GITHUB_SHA}
          - Version: 0.11.1
          - Complete unit and repository validation suite: passed
          - Deterministic goal runtime self-test: passed
          - Behavioral invariant self-test: passed
          - Skills CLI discovery: passed
          - Standalone and combined package construction: passed
          - Archive reference closure and SHA-256 generation: passed
          - Live authenticated host matrix: pending, retained as an explicit beta gate
          EOF

      - name: Commit the permanent verified main tree
        shell: bash
        run: |
          git config user.name "Chris Duvillard"
          git config user.email "duvillard.c@gmail.com"
          git add -A
          git commit -m "Finalize 0.11.1 runtime and package hardening"
          git push origin HEAD:main

      - name: Rebuild and republish immutable release assets
        shell: bash
        run: |
          rm -rf dist
          python scripts/package_skills.py
          if gh release view v0.11.1 >/dev/null 2>&1; then
            gh release delete v0.11.1 --cleanup-tag --yes
          fi
          gh release create v0.11.1 dist/* \
            --target "$(git rev-parse HEAD)" \
            --title v0.11.1 \
            --generate-notes

      - name: Delete the merged audit branch when present
        shell: bash
        run: |
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/audit-remediation-runtime-hardening" || true
