name: Validate library

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adversarial-tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Compile and run adversarial tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v

  validate:
    needs: adversarial-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.20.0"
          cache: npm

      - name: Install locked Skills CLI
        run: npm ci --ignore-scripts

      - name: Validate repository contract
        run: python scripts/validate_repository.py

      - name: Verify canonical goal launchers
        run: python scripts/sync_goal_launchers.py --check

      - name: Verify generated goal libraries
        run: python scripts/sync_goal_docs.py --check

      - name: Protect append-only shaping history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/validate_shaping_history_diff.py --self-test --base-ref "$BASE_SHA"

      - name: Validate shaping question state
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/validate_question_state.py --self-test --base-ref "$BASE_SHA"

      - name: Validate goal archives
        run: python scripts/validate_goal_archives.py --self-test

      - name: Validate tooling contract
        run: python scripts/validate_tooling_contract.py --self-test

      - name: Validate deterministic goal runtime
        run: python skills/goal-engine/scripts/goalctl.py self-test

      - name: Validate behavioral invariants
        run: python scripts/evaluate_behavior.py --self-test

      - name: Verify Agent Skills CLI discovery
        shell: bash
        run: |
          output="$(npx --no-install skills add . --list)"
          printf '%s\n' "$output"
          grep -q "shape-goal" <<<"$output"
          grep -q "goal-engine" <<<"$output"

      - name: Package reusable skills
        run: python scripts/package_skills.py

      - name: Upload reusable skill packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loop-engineering-skill-packages
          path: dist/
          if-no-files-found: error
          retention-days: 30
